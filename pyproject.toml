[project]
name = "rescuekv"
version = "0.1.0"
description = "RescueKV: training-free self-correction protection primitive over KV eviction backends"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.3",
    "transformers>=4.44",
    "accelerate>=0.33",
    "datasets>=2.20",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "sympy>=1.12",
    "math-verify>=0.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# 需要 CUDA 工具链 + 编译，单独安装：uv pip install -e ".[flash]" --no-build-isolation
flash = ["flash-attn>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rkv"]

[tool.uv]
# torch 在 Linux 默认 PyPI wheel 即含 CUDA，无需额外 index；如需指定见 README
package = true
