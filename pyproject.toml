[project]
name = "kvbench"
version = "0.1.0"
description = "KV eviction policy evaluation framework"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # 与 vllm 0.25.1 对齐（也是 R-KV 上游 vLLM 端口所 pin 的版本）：
    # vllm 0.25.1 精确要求 torch==2.11.0、transformers>=5.5.3。
    # torch 2.11.0 是 cu128 索引上的最高版本，正好匹配本机 CUDA 12.8 / 驱动 550，不需要升驱动。
    # transformers 5.x 是破坏性升级，升级后必须重构 cache 访问（见 note/framework/02-升级.md）。
    "torch==2.11.0",
    "transformers>=5.5.3,<6",
    "accelerate>=0.33",
    "datasets>=2.20",
    "numpy>=2.2",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "sympy>=1.12",
    "math-verify>=0.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# 需要 CUDA 工具链 + 编译，单独安装：uv pip install -e ".[flash]" --no-build-isolation
flash = ["flash-attn>=2.6"]
# vLLM 吞吐测速专用。0.25.1 也是 R-KV 上游端口所 pin 的版本，两者匹配。
# 它的依赖栈会拉起完整的 vLLM serving 环境，与主库的 eager-attention 评测路径互斥
# （vLLM 走 cudagraph，取不到逐步 attention）。
# 仅仅 `uv sync --extra efficiency` 还不够——R-KV 的 vLLM 端口需要打 wiring patch，
# 必须走 rkv-efficiency/scripts/apply_rkv.sh + `pip install -e vllm-src`。
# 见 note/framework/02-升级.md。
efficiency = ["vllm==0.25.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kv_eviction", "kvbench"]

[tool.uv]
package = true
allow-insecure-host = [
    "pypi.tuna.tsinghua.edu.cn",
    "pypi.org",
    "files.pythonhosted.org",
    "mirror.sjtu.edu.cn",
    "mirrors.aliyun.com",
    "download.pytorch.org",
    "huggingface.co",
    "hf-mirror.com",
]

[[tool.uv.index]]
name = "pypi-tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# Linux 锁到 CUDA 12.8 的 torch（vllm 0.25.1 要求 torch==2.11.0；torch 2.11.0 是
# cu128 索引上的最高版本）。匹配本机 CUDA 12.8 / 驱动 550，无需升级驱动。
# 注意：不要升到 cu129/cu130 —— 那需要驱动 >= 575/580。
# 用上海交大镜像而非 download.pytorch.org —— 后者在国内机器上 failed to fetch。
# 镜像内容与官方一致（含 torch-2.11.0+cu128 全部 wheel）。
# macOS 用默认 PyPI 源（CPU/mps）。
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
