# Complete single-strategy H2O baseline config.

experiment:
  name: math500_h2o_b1024
  out: results/math500_h2o_b1024.json

model:
  name: deepseek-ai/DeepSeek-R1-Distill-Llama-8B
  dtype: bfloat16
  device_map: cuda
  attn: auto
  fast_attn: sdpa

data:
  dataset: math500
  n: 1

generation:
  max_new: 16384
  do_sample: true
  temperature: 0.6
  top_p: 0.95
  seed: 0

eviction:
  recent: 8
  sink: 0
  evict_every: 128
  obs_window: 8
  obs_decay: 0.9

arms:
  - id: h2o_b1024
    policy: h2o
    budget: 1024
