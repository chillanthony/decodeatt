# R-KV paper smoke reproduction config.

model: deepseek-ai/DeepSeek-R1-Distill-Llama-8B
dtype: bfloat16
device_map: cuda
attn: eager

dataset: math500
n: 1
max_new: 16384
do_sample: true
temperature: 0.6
top_p: 0.95
seed: 0

# Paper Table 2 budget points:
# MATH: 128,256,512,768,1024,1536,2048
# AIME24: 128,256,512,768,1024,1536,2048,2560,3072,4096
arms: fullkv,snapkv@1024,h2o@1024,streamingllm@1024,rkv@1024
recent: 8
sink: 0
evict_every: 128
obs_window: 8
obs_decay: 0.9

policy_params:
  streamingllm:
    first_tokens: 4
  rkv:
    lambda: 0.1
    alpha: 8
    retain_ratio: 0.1
    retain_direction: last
    similarity_threshold: 0.5
    pool_kernel: 7
    redundancy_chunk: 512
  criticalkv:
    window_size: 32
    kernel_size: 5
    critical_threshold: 0.9
    variable_head_budget: false
  defensivekv:
    window_size: 32
    kernel_size: 5
    critical_threshold: 0.9
    variable_head_budget: true

out: results/rkv_smoke.json
