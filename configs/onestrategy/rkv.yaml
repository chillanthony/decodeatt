# Complete single-strategy R-KV baseline config.

experiment:
  name: math500_rkv_b1024
  out: results/math500_rkv_b1024.json

model:
  name: deepseek-ai/DeepSeek-R1-Distill-Llama-8B
  dtype: bfloat16
  device_map: cuda
  attn: auto
  fast_attn: sdpa

data:
  dataset: math500
  n: 1

generation:
  max_new: 16384
  do_sample: true
  temperature: 0.6
  top_p: 0.95
  seed: 0
  batch_size: 1
  num_return_sequences: 1
  seed_offset: 0
  problem_batch_size: 1
  prompt_bucket_size: 0

eviction:
  recent: 8
  sink: 0
  evict_every: 128
  obs_window: 8
  obs_decay: 0.9

policy_defaults:
  rkv:
    lambda: 0.1
    alpha: 8
    retain_ratio: 0.1
    retain_direction: last
    similarity_threshold: 0.5
    pool_kernel: 7
    redundancy_chunk: 512

arms:
  - id: rkv_b1024
    policy: rkv
    budget: 1024
