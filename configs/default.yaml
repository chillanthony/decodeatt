# RescueKV 默认配置（Step 0 诊断阶段）

# ---- 模型 ----
model: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
dtype: bfloat16              # 模型计算精度
device: cuda

# ---- KV 分页 ----
page_size: 16               # 每 page 含的 token 数；统计/淘汰/豁免的最小单位（对齐 Quest）

# ---- 生成 ----
max_new_tokens: 8192        # 单条 CoT 生成上限（长推理需要大）
temperature: 0.6            # R1-Distill 推荐采样温度
top_p: 0.95

# ---- 诊断超参 ----
mri_topk: 32                # 算 MRI 时，判定某 page 在该步"算重要"的 top-k 阈值
receiver_topk: 8            # reflection 步反查 R_t 时，取注意力最高的前 k 个 page
exclude_recent_pages: 4     # receiver 反查时屏蔽当前及最近 N 个 page（只看早期回指）
keep_frac: 0.2              # 错杀率代理：通用淘汰器保留累计注意力 top 20% 的 page
probe_max_len: 4096         # 探针前向的最大序列长度（控 output_attentions 显存）
probe_layers: null          # 探针取哪些层（null=全层平均；可指定 receiver 层子集）
entropy_quantile: 0.6       # reflection 步再叠加"高熵步"过滤的分位阈值（null=不过滤）
attn_implementation: eager  # 探针须 eager 才返回 attentions；纯生成可改 sdpa 提速

# ---- 路径 ----
data_dir: data              # 数据集缓存
trace_dir: data/traces      # CoT trace 落盘
results_dir: results        # 诊断指标/图/表
