# Shared, frozen setup for TideProbe Step 1 FullKV trajectories.

experiment:
  name: tideprobe_step1

model:
  name: deepseek-ai/DeepSeek-R1-Distill-Llama-8B
  dtype: bfloat16
  fast_attn: sdpa

data:
  dataset: aime
  n: 10

generation:
  max_new: 32768
  do_sample: true
  temperature: 0.6
  top_p: 0.95
  seed: 0

diagnostics:
  trace_dir: /home/ma-user/work/bucket-wulan-green/chenyanbo/trace
  signals_dir: runs/tideprobe_step1/signals
  events_path: runs/tideprobe_step1/transition_events.jsonl
  metrics_path: runs/tideprobe_step1/transition_metrics.json
  figures_dir: runs/tideprobe_step1/figures
  layer_sensitivity_dir: runs/tideprobe_step1/layer_sensitivity
  layer_sensitivity_path: runs/tideprobe_step1/layer_sensitivity.csv
  layer_sensitivity_summary_path: runs/tideprobe_step1/layer_sensitivity_summary.csv
  layer_sensitivity_metrics_path: runs/tideprobe_step1/layer_sensitivity_metrics.json
  eviction_alignment_dir: runs/tideprobe_step1/eviction_alignment_raw
  eviction_alignment_path: runs/tideprobe_step1/eviction_alignment.csv
  eviction_alignment_metrics_path: runs/tideprobe_step1/eviction_alignment_metrics.json
  eviction_alignment_figure: runs/tideprobe_step1/figures/transition_hit_nll.png
  sparse_cliff_path: runs/tideprobe_step1/sparse_cliff.csv
  sparse_cliff_summary_path: runs/tideprobe_step1/sparse_cliff_summary.csv
  sparse_cliff_metrics_path: runs/tideprobe_step1/sparse_cliff_metrics.json
  sparse_cliff_figure: runs/tideprobe_step1/figures/budget_cf.png
  # Optional JSONL rows: {"id": "aime-0", "token_index": 123, "type": "manual"}
  manual_labels: null
  transition:
    rolling_window: 64
    peak_threshold: 2.0
    peak_radius: 8
    min_distance: 16
    event_tolerance: 16
    max_review_events: 50
    context_radius: 32
  layer_sensitivity:
    scan_mode: group
    group_size: 4
    budgets: 256,512
    mask_policies: random,window
    random_seeds: 0,1,2
    probe_types: uniform,transition,ordinary
    horizon: 32
    min_probe_index: 32
    uniform_count: 1
    max_transitions_per_trace: 1
    ordinary_offset: 128
    transition_exclusion: 64
    rkv:
      alpha: 8
      lambda: 0.1
      pool_kernel: 7
      similarity_threshold: 0.5
      retain_ratio: 0.1
      retain_direction: last
      redundancy_chunk: 512
  eviction_alignment:
    strategies: rkv,snapkv,window,random
    budgets: 512,1024,1536
    seed: 0
    recent: 8
    sink: 0
    evict_every: 128
    obs_window: 8
    obs_decay: 0.9
    transition_window: 16
    downstream_horizon: 32
    high_hit_threshold: 0.01
    low_hit_threshold: 0.0
    policy_params:
      rkv:
        alpha: 8
        lambda: 0.1
        pool_kernel: 7
        similarity_threshold: 0.5
        retain_ratio: 0.1
        retain_direction: last
        redundancy_chunk: 512
      snapkv:
        window_size: 8
        kernel_size: 7
        pooling: maxpool
  sparse_cliff:
    strategies: rkv,snapkv,window,random
    budgets: 512,1024,1536
    transition_window: 16
    safety_threshold: 0.9
